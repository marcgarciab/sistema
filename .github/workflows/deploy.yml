name: Desplegar Hall of Fame

# Se ejecuta en cada cambio subido a la rama principal y también a mano
# (pestaña Actions → "Desplegar Hall of Fame" → "Run workflow").
on:
  push:
    branches: [claude/hall-of-fame-sistema-1pct-b5n705, main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      KV_TITLE: sistema1-hall-of-fame-kv
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Comprobar secrets
        id: check
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$NOTION_TOKEN" ] && missing="$missing NOTION_TOKEN"
          if [ -n "$missing" ]; then
            echo "::warning::Faltan secrets en GitHub (Settings → Secrets and variables → Actions):$missing. No se despliega."
            echo "### ⏸️ Despliegue en pausa" >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan los secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instalar y testear
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm test

      - name: Crear (o reutilizar) el almacenamiento KV
        if: steps.check.outputs.ready == 'true'
        run: |
          find_id() {
            npx wrangler kv namespace list 2>/dev/null | node -e '
              let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                const m=s.match(/^\[[\s\S]*^\]/m);const list=m?JSON.parse(m[0]):[];
                const ns=list.find(n=>n.title===process.env.KV_TITLE);
                if(ns)process.stdout.write(ns.id);
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Creando KV $KV_TITLE…"
            npx wrangler kv namespace create "$KV_TITLE"
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::No se pudo crear/encontrar el KV. Revisa los permisos del token de Cloudflare."; exit 1; fi
          echo "KV id: $id"
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$id/" wrangler.jsonc

      - name: Desplegar el Worker
        if: steps.check.outputs.ready == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Guardar secrets en Cloudflare
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$NOTION_TOKEN" | npx wrangler secret put NOTION_TOKEN
          # Token de refresco nuevo en cada despliegue (solo lo usa este workflow).
          REFRESH_TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "REFRESH_TOKEN=$REFRESH_TOKEN" >> "$GITHUB_ENV"
          printf '%s' "$REFRESH_TOKEN" | npx wrangler secret put REFRESH_TOKEN

      - name: Primera sincronización con Notion
        if: steps.check.outputs.ready == 'true'
        run: |
          {
            echo "### ✅ Hall of Fame desplegado"
            [ -n "$WORKER_URL" ] && echo "URL: $WORKER_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$WORKER_URL" ]; then
            echo "::warning::No hay URL workers.dev (¿subdominio workers.dev sin activar?). El Cron sincronizará igualmente en ≤30 min."
            exit 0
          fi
          # El secret tarda unos segundos en propagarse.
          for i in 1 2 3 4 5 6; do
            sleep 10
            res="$(curl -sS -X POST -H "Authorization: Bearer $REFRESH_TOKEN" "$WORKER_URL/api/refresh" || true)"
            echo "Intento $i: $res"
            if echo "$res" | grep -q '"ok":true'; then
              echo "Sincronización: $res" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "Sincronización fallida: $res" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::La sincronización con Notion falló: $res"
          exit 1
